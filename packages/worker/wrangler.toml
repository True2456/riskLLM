name = "riskllm"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# The built React UI ships as static ASSETS on this same worker — one origin
# serves the game, /api, /game (WS) and /mcp, so the web app's same-origin
# calls work with zero CORS. Build web first: `npm run build` at the repo root.
[assets]
directory = "../web/dist"

# PRODUCTION: point the routes at your custom domain once you have one
# (AdSense requires a custom domain; workers.dev is fine for everything else).
# Uncomment + fill in <DOMAIN>, or add routes in the dashboard.
# routes = ["<DOMAIN>/*"]
#
# Local `wrangler dev` serves everything on :8787 (no routes needed).

[[durable_objects.bindings]]
name = "GAME"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "BOARD"
class_name = "Board"

[[durable_objects.bindings]]
name = "LEAGUE"
class_name = "League"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Board"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["League"]

[observability]
enabled = true
