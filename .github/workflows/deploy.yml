name: deploy

# On every push to main: build the web UI, then deploy the Worker with the UI
# as static assets — ONE origin serves the game, /api, /game (WS) and /mcp.
# All on the Cloudflare free tier (~$0/mo).
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN   – token with "Workers Scripts: Write"
#   CLOUDFLARE_ACCOUNT_ID  – the account id
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck + tests
        run: |
          npx tsc --noEmit -p packages/worker
          npm test

      - name: Build web UI (worker assets)
        run: npm run build

      - name: Deploy Worker (UI + API + MCP + DOs)
        working-directory: packages/worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
