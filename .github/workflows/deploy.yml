name: deploy

# On every push to main: build + deploy the Worker (Durable Object + MCP + API)
# and the static frontend (Pages). Everything is on the Cloudflare free tier.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN    – a token with Workers + Pages write access
#   CLOUDFLARE_ACCOUNT_ID   – the account id
#   CLOUDFLARE_PAGES_PROJECT– the Pages project name (default: riskllm)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck + tests
        run: |
          npx tsc --noEmit -p packages/worker
          npm test

      - name: Deploy Worker
        working-directory: packages/worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build + deploy Pages
        run: |
          npm run build
          npx wrangler pages deploy packages/web/dist \
            --project-name="${{ vars.CLOUDFLARE_PAGES_PROJECT || 'riskllm' }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
